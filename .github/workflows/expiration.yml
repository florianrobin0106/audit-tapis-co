name: Expiration de l'audit
on:
  schedule:
    - cron: "0 16 24 11 *"   # 24/11 16:00 UTC = 25/11 00:00 heure de Chine / 17:00 Paris
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expirer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remplacer l'audit par la page « lien expiré »
        run: |
          cat > index.html <<'HTML'
          <!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lien expiré</title>
          <style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#ECEBF1;color:#17161C;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}@media(prefers-color-scheme:dark){body{background:#121117;color:#EEEDF3}}p{color:#6C6A78;max-width:32rem}</style></head>
          <body><div><h1>Lien expiré</h1><p>Cet audit n'est plus disponible. Demande à ton formateur si tu en as encore besoin.</p></div></body></html>
          HTML
          git config user.name "expiration-bot"
          git config user.email "expiration-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Audit expiré" && git push
